workflows:
  recvx-ios-build:
    name: RECVX Native iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: 16.2
    scripts:
      - name: Fetch Missing Submodules Recursively
        script: |
          git submodule update --init --recursive
      - name: Install Correct Packaging Dependencies
        script: |
          # Install the underlying compiler and system generation packages
          brew install cmake ninja pkg-config sdl2
      - name: Fix and Execute Native iOS Configuration
        script: |
          # Create clean isolated folders to keep CMake from getting confused
          mkdir -p build_ios && cd build_ios
          
          # Initialize target configurations with strict compilation rules
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCOMPRESS_ASSETS=OFF \
            -DBUILD_PACKAGED=OFF \
            -DCMAKE_BUILD_TYPE=Release
      - name: Compile Unsigned Application Executable
        script: |
          cd build_ios
          # Scan for generated xcode files and force cross-compilation target execution
          X_PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          xcodebuild -project "$X_PROJ" -target recvx -configuration Release -sdk iphoneos ARCHS="arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" Build
      - name: Package Manual Unsigned IPA Layout
        script: |
          mkdir -p Payload
          # Grab the fresh executable payload box out of the derived outputs
          APP_PATH=$(find build_ios/ -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Application binary could not be generated."
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r recvx_unsigned.ipa Payload
          mkdir -p build/ios/ipa
          mv recvx_unsigned.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
