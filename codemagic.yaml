workflows:
  recvx-ios-build:
    name: RECVX Native iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: 16.2
    triggering:
      events:
        - push
    scripts:
      - name: Hard Reset Workspace Environment
        script: |
          # Purge everything to stop Codemagic from using old cached build.sh commands
          git clean -fxd
          git submodule foreach --recursive git clean -xfd
          git submodule update --init --recursive --force
      - name: Deploy Mac Development Packages
        script: |
          brew install cmake ninja pkg-config sdl2
      - name: Force Custom iOS Project Layout
        script: |
          mkdir -p build_ios && cd build_ios
          # Hard-coding absolute paths so CMake cannot look for missing assets
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCOMPRESS_ASSETS=OFF \
            -DBUILD_PACKAGED=OFF \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
      - name: Build Standalone Executable Binary
        script: |
          cd build_ios
          X_PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          xcodebuild -project "$X_PROJ" -target recvx -configuration Release -sdk iphoneos ARCHS="arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" Build
      - name: Package Manual Unsigned IPA Layout
        script: |
          mkdir -p Payload
          APP_PATH=$(find build_ios/ -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Application binary could not be generated."
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r recvx_unsigned.ipa Payload
          mkdir -p build/ios/ipa
          mv recvx_unsigned.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa

