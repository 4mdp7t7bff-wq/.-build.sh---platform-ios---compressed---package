workflows:
  recvx-ios-build:
    name: RECVX Native iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: 16.2
    scripts:
      - name: Build Unsigned Xcode Project
        script: |
          XCODE_PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          XCODE_WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          
          if [ -n "$XCODE_WORKSPACE" ]; then
            SCHEME=$(xcodebuild -workspace "$XCODE_WORKSPACE" -list | sed -n '/Schemes:/,$p' | sed '1d' | tr -d ' ' | head -n 1)
            xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$SCHEME" -configuration "Release" CODE_SIGNING_ALLOWED=NO
          elif [ -n "$XCODE_PROJ" ]; then
            SCHEME=$(xcodebuild -project "$XCODE_PROJ" -list | sed -n '/Schemes:/,$p' | sed '1d' | tr -d ' ' | head -n 1)
            xcodebuild -project "$XCODE_PROJ" -scheme "$SCHEME" -configuration "Release" CODE_SIGNING_ALLOWED=NO
          else
            echo "Error: No project found!"
            exit 1
          fi
      - name: Package into Unsigned IPA
        script: |
          mkdir -p Payload
          # Find the compiled app bundle and copy it
          APP_PATH=$(find build/ -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi
          cp -r "$APP_PATH" Payload/
          zip -r recvx_unsigned.ipa Payload
          mkdir -p build/ios/ipa
          mv recvx_unsigned.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
