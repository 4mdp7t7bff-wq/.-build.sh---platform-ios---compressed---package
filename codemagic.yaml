workflows:
  recvx-ios-build:
    name: RECVX Native iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: 16.2
    scripts:
      - name: Fetch Missing Submodules Recursively
        script: |
          git submodule update --init --recursive
      - name: Install Missing Native Dependencies
        script: |
          # Install vital build tools required for low-level C++ port configurations
          brew install cmake ninja pkg-config SDL2
      - name: Configure CMake for Standalone Executable
        script: |
          mkdir -p build_ios
          cd build_ios
          # Initialize the iOS metadata tree and forcefully disable asset hooks
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCOMPRESS_ASSETS=OFF \
            -DBUILD_PACKAGED=OFF
      - name: Compile Standalone Binaries
        script: |
          cd build_ios
          # Compile exclusively the engine container shell
          xcodebuild -project *.xcodeproj -target recvx -configuration Release -sdk iphoneos ARCHS="arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" Build
      - name: Package Manual Unsigned IPA Layout
        script: |
          mkdir -p Payload
          APP_PATH=$(find build_ios/ -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Executable compilation failed."
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r recvx_unsigned.ipa Payload
          mkdir -p build/ios/ipa
          mv recvx_unsigned.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
