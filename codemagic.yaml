workflows:
  recvx-ios-build:
    name: RECVX Native iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: 16.2
    scripts:
      - name: Fetch Missing Submodules Recursively
        script: |
          git submodule update --init --recursive
      - name: Make Build Script Executable
        script: |
          chmod +x build.sh
      - name: Run Native iOS Build Script
        script: |
          # Removed --compressed to bypass missing ISO file errors
          ./build.sh --platform ios --package
      - name: Package into Unsigned IPA
        script: |
          mkdir -p Payload
          # Locate the .app directory built inside the project target output tree
          APP_PATH=$(find . -name "*.app" 2>/dev/null | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Native build script did not output a valid .app binary!"
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r recvx_unsigned.ipa Payload
          mkdir -p build/ios/ipa
          mv recvx_unsigned.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
