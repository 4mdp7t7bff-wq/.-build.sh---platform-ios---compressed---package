workflows:
  recvx-ios-build:
    name: RECVX Native iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: 16.2
    scripts:
      - name: Fetch Missing Submodules Recursively
        script: |
          # Pulls any internal framework dependencies required by the native engine
          git submodule update --init --recursive
      - name: Generate Xcode Project via CMake
        script: |
          mkdir -p build_ios
          cd build_ios
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""
      - name: Build Unsigned Xcode Project
        script: |
          cd build_ios
          # Find the exact workspace or project generated by CMake
          XCODE_PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          XCODE_WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          
          if [ -n "$XCODE_WORKSPACE" ]; then
            SCHEME=$(xcodebuild -workspace "$XCODE_WORKSPACE" -list | sed -n '/Schemes:/,$p' | sed '1d' | tr -d ' ' | head -n 1)
            xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$SCHEME" -configuration "Release" -sdk iphoneos ARCHS="arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" Build
          elif [ -n "$XCODE_PROJ" ]; then
            SCHEME=$(xcodebuild -project "$XCODE_PROJ" -list | sed -n '/Schemes:/,$p' | sed '1d' | tr -d ' ' | head -n 1)
            xcodebuild -project "$XCODE_PROJ" -scheme "$SCHEME" -configuration "Release" -sdk iphoneos ARCHS="arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" Build
          else
            echo "Error: No project structure found!"
            exit 1
          fi
      - name: Package into Unsigned IPA
        script: |
          mkdir -p Payload
          APP_PATH=$(find build_ios/ -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file missing from build."
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r recvx_unsigned.ipa Payload
          mkdir -p build/ios/ipa
          mv recvx_unsigned.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa

